name: Field report
description: Share a consent-aware, redacted outcome from a MoneyPrinter route.
title: "Field report: "
labels:
  - field-report
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not upload or paste original evidence, secrets, customer data, private documents, or material you lack permission to share. A failed or stopped test is useful evidence.

        Use exactly one evidence label:
        - **Cash collected** — settled payment backed by an inspected processor or bank settlement artifact.
        - **Revenue contracted** — signed obligation backed by an inspected signed agreement or equivalent binding-order artifact.
        - **Revenue booked** — an invoice or order has been created but has not settled.
        - **Pipeline signal** — a buyer reply, accepted meeting, proposal, waitlist entry, or documented intent.
        - **Estimated economic value** — modeled value with a formula, assumptions, and sensitivity.
        - **Simulation** — a benchmark or hypothetical result, labeled beside every headline number.
        - **Unverified anecdote** — an unsupported reported result without the artifact required for a stronger label.

        A statement or user attestation alone cannot establish **Cash collected** or **Revenue contracted**. If settlement evidence or a signed-obligation artifact is unavailable, select **Unverified anecdote**.

        Keep originals private. In the redacted-evidence field, describe only the artifact type, relevant status, date window, currency, and rounded amount when safe. Remove names, account or transaction numbers, signatures, customer data, confidential terms, and identifying metadata.
  - type: dropdown
    id: result_label
    attributes:
      label: Result label
      description: Choose the single label that best describes the result.
      options:
        - Cash collected
        - Revenue contracted
        - Revenue booked
        - Pipeline signal
        - Estimated economic value
        - Simulation
        - Unverified anecdote
    validations:
      required: true
  - type: input
    id: date_range
    attributes:
      label: Date range
      placeholder: 2026-07-01 to 2026-07-07
    validations:
      required: true
  - type: input
    id: model_harness
    attributes:
      label: Model and harness
      placeholder: Model version, agent host, and relevant skill version
    validations:
      required: true
  - type: textarea
    id: human_time
    attributes:
      label: Human time
      description: State total human time and the material tasks performed.
    validations:
      required: true
  - type: textarea
    id: spend
    attributes:
      label: Cash spend
      description: State the amount, currency, and what it covered; write zero if none.
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Method and starting assets
      description: Describe the route, approvals, starting conditions, and bounded test.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Describe the privacy-safe redacted artifact details you inspected; do not upload or paste the original. If Cash collected or Revenue contracted lacks its required artifact, select Unverified anecdote.
    validations:
      required: true
  - type: textarea
    id: failures
    attributes:
      label: Failures, contrary evidence, or stop conditions
      description: What did not work, what changed, and what should others avoid?
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Consent and safety
      options:
        - label: I have permission to share this redacted report and did not include secrets or personal data.
          required: true
        - label: I used the definitions above. If I selected Cash collected or Revenue contracted, I inspected the required supporting artifact; otherwise I selected Unverified anecdote.
          required: true
